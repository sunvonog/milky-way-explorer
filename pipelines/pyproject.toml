[project]
name = "pipelines"
version = "0.1.0"
description = "Offline data pipelines for Milky Way Explorer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1,<9",
    "astroquery>=0.4.11,<0.5",
    "logly>=0.2.1,<0.3",
    "polars>=1.43.0",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN201", "ANN202", "B", "SIM", "PTH"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = true
